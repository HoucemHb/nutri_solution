server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase client max body size for file uploads
    client_max_body_size 50M;

    # IMPORTANT: More specific locations MUST come first

    # Static file serving for uploads - MOST SPECIFIC FIRST
    location ^~ /api/uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Debug headers (remove after testing)
        add_header X-Debug-Location "uploads-proxy" always;
        add_header X-Debug-Backend "http://backend:3000/uploads/" always;

        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API proxy - LESS SPECIFIC
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Debug header (remove after testing)
        add_header X-Debug-Location "api-proxy" always;

        # Timeout settings for file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings for large files
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Cache static files served by nginx directly (excluding API paths)
    location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve Angular app - LEAST SPECIFIC LAST
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1000;
}
