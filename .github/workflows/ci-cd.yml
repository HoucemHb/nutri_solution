  deploy:
    name: 🚀 Deploy on Local WSL
    runs-on: self-hosted
    # needs: build

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Ensure Docker is available
      - name: Setup Docker Access
        run: |
          # Check Docker is installed
          if ! command -v docker &> /dev/null; then
            echo "Docker is not installed. Please install Docker Desktop with WSL integration."
            exit 1
          fi

          # Add current user to docker group (if not already)
          if ! groups $(whoami) | grep -q docker; then
            echo "Adding user to docker group..."
            sudo usermod -aG docker $(whoami)
            echo "⚠️ You may need to restart WSL to apply docker group changes."
          fi

          # Test Docker access
          docker info

      # 3️⃣ Create .env file
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 4️⃣ Deploy using Docker Compose
      - name: Deploy with Docker Compose
        run: |
          docker-compose down --remove-orphans
          docker system prune -f
          docker-compose pull
          docker-compose up -d
          echo "✅ Deployment complete!"
