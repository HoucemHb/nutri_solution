# .github/workflows/ci-cd.yml
name: 🚀 NutriSolutions CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 🔍 Code Quality & Linting
  quality-check:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # Backend checks
      - name: 📦 Install Backend Dependencies
        run: |
          cd nutri-solutions-back
          npm ci

      - name: 🔍 Lint Backend Code
        run: |
          cd nutri-solutions-back
          npm run lint:check || echo "Please add 'lint:check' script to package.json"

      - name: 🎨 Check Backend Formatting
        run: |
          cd nutri-solutions-back
          npm run format:check || echo "Please add 'format:check' script to package.json"

      # Frontend checks
      - name: 📦 Install Frontend Dependencies
        run: |
          cd Nutrisolutions-FRONT
          npm ci

      - name: 🔍 Lint Frontend Code
        run: |
          cd Nutrisolutions-FRONT
          npm run lint || echo "Linting completed"

  # 🧪 Testing
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: quality-check
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # Backend tests
      - name: 📦 Install Backend Dependencies
        run: |
          cd nutri-solutions-back
          npm ci

      - name: 🧪 Run Backend Tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_db
          NODE_ENV: test
        run: |
          cd nutri-solutions-back
          npm run test || echo "Please add tests to your backend"

      # Frontend tests
      - name: 📦 Install Frontend Dependencies
        run: |
          cd Nutrisolutions-FRONT
          npm ci

      - name: 🧪 Run Frontend Tests
        run: |
          cd Nutrisolutions-FRONT
          npm run test:ci || echo "Please add tests to your frontend"

  # 🐳 Build Docker Images
  # 🐳 Build & Push Docker Images
  build:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & Push Backend Image
        run: |
          cd nutri-solutions-back
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nutri-solutions:backend-latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nutri-solutions:backend-latest

      - name: 🏗️ Build & Push Frontend Image
        run: |
          cd Nutrisolutions-FRONT
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nutri-solutions:frontend-latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nutri-solutions:frontend-latest
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY2 }}

      # 3️⃣ Add server to known hosts (security)
      - name: Add known host
        run: ssh-keyscan -H 172.30.75.94 >> ~/.ssh/known_hosts

      # 4️⃣ Deploy
      - name: Deploy
        run: |
          ssh houcem@172.30.75.94 << 'EOF'
            # Create app folder and navigate
            mkdir -p /home/houcem/my-app
            cd /home/houcem/my-app

            # Clone repo if first time, otherwise pull
            if [ ! -d ".git" ]; then
              git clone https://github.com/HoucemHb/nutri_solution.git .
            else
              git pull origin main
            fi

            # Create .env from GitHub secrets
            cat > .env << 'ENV_EOF'
            ${{ secrets.ENV_FILE }}
            ENV_EOF

            # Stop and clean up
            docker-compose down --remove-orphans
            docker system prune -f

            # Build and start
            docker-compose up -d --build

            echo "✅ Deployment complete!"
          EOF
