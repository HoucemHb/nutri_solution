global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules.yml"

scrape_configs:
  # NestJS Application Metrics
  - job_name: "nestjs-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000"]
    scrape_interval: 10s

  # System Metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
